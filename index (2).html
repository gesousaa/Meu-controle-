<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Controle</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3F1;--card:#fff;--ink:#12302B;--mute:#6B817C;--line:#DCE5E2;--brand:#0F4C45;--on:#fff;--in:#1E8E5A;--out:#D8434B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0D1A18;--card:#152622;--ink:#E6F0ED;--mute:#8FA8A2;--line:#243A35;--brand:#3FBFA8;--on:#06201C;--in:#4CC98A;--out:#FF7A80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 "Plus Jakarta Sans",system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 120px}
.hi{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:8px 4px 2px}
.sub{color:var(--mute);margin:0 4px 16px;font-size:14px}
.hero{background:var(--brand);color:var(--on);border-radius:22px;padding:22px 20px}
.hero small{opacity:.8}
.big{font-size:40px;font-weight:800;letter-spacing:-1px;margin:2px 0 14px}
.row{display:flex;gap:12px}.row>div{flex:1}.row b{display:block;font-size:17px}
.acts{display:flex;gap:10px;margin-top:14px}
.acts button{flex:1;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px inherit;font-family:inherit;cursor:pointer}
.acts .i{color:var(--in)}.acts .o{color:var(--out)}
h2{font-size:15px;margin:26px 4px 10px;display:flex;justify-content:space-between;align-items:center}
h2 a{font-size:13px;font-weight:600;color:var(--brand);cursor:pointer}
.card{background:var(--card);border-radius:16px;padding:6px 16px}
.cat{padding:10px 0}.cat+.cat{border-top:1px solid var(--line)}
.cat .l{display:flex;justify-content:space-between;font-size:14px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--out);border-radius:3px}
.day{font-size:13px;color:var(--mute);margin:16px 4px 6px}
.tx{display:flex;align-items:center;gap:12px;padding:12px 0}.tx+.tx{border-top:1px solid var(--line)}
.tx .d{flex:1;min-width:0}.tx .d span{display:block;font-size:12px;color:var(--mute)}
.tx .v{font-weight:600}.in{color:var(--in)}.out{color:var(--out)}
.tx button{background:none;border:0;color:var(--mute);font-size:18px;cursor:pointer;padding:6px}
.empty{padding:22px 0;text-align:center;color:var(--mute);font-size:14px}
.mes{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mes button{background:none;border:0;color:var(--ink);font-size:24px;padding:8px 14px;cursor:pointer;border-radius:10px}
.mes b{text-transform:capitalize;font-size:17px}
.nome{display:flex;gap:8px;padding:12px 0}.nome input{flex:1}.nome button{padding:0 16px;border:0;border-radius:10px;background:var(--brand);color:var(--on);font:600 15px inherit;font-family:inherit;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:520px}
nav button{flex:1;background:none;border:0;padding:10px 0 12px;color:var(--mute);font:600 12px inherit;font-family:inherit;cursor:pointer}
nav button span{display:block;font-size:22px;line-height:1.2}
nav button.on{color:var(--brand)}
.fab{position:fixed;right:max(18px,calc(50% - 242px));bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--brand);color:var(--on);border:0;border-radius:28px;padding:15px 22px;font:600 16px inherit;font-family:inherit;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer}
dialog{border:0;border-radius:20px;padding:20px;width:min(92vw,420px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}dialog h3{margin:0 0 14px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font:600 15px inherit;font-family:inherit;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:16px inherit;font-family:inherit}
.save{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:var(--brand);color:var(--on);font:600 16px inherit;font-family:inherit;cursor:pointer}
.cancel{width:100%;margin-top:6px;padding:12px;border:0;background:none;color:var(--mute);font:15px inherit;font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
</style>
</head>
<body>
<main id="app"></main>
<button class="fab" id="add">+ Lançar</button>
<nav><div>
  <button data-t="home"><span>⌂</span>Início</button>
  <button data-t="ext"><span>☰</span>Extrato</button>
  <button data-t="res"><span>◐</span>Resumo</button>
</div></nav>

<dialog id="dlg">
  <h3>Novo lançamento</h3>
  <div class="seg"><button id="tD" class="on">Despesa</button><button id="tR">Receita</button></div>
  <label for="val">Valor (R$)</label><input id="val" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0,00">
  <label for="desc">Descrição</label><input id="desc" type="text" placeholder="Ex.: mercado">
  <label for="cat">Categoria</label><select id="cat"></select>
  <label for="dt">Data</label><input id="dt" type="date">
  <button class="save" id="save">Salvar lançamento</button>
  <button class="cancel" id="cancel">Cancelar</button>
</dialog>

<script>
const CD=["Alimentação","Moradia","Transporte","Lazer","Saúde","Educação","Outros"],CR=["Salário","Freelance","Investimentos","Outros"];
const $=id=>document.getElementById(id),brl=n=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tx=[],nome="",tab="home",tipo="D",cur=new Date();cur.setDate(1);
try{tx=JSON.parse(localStorage.getItem("tx")||"[]");nome=localStorage.getItem("nome")||""}catch(e){}
const persist=()=>{try{localStorage.setItem("tx",JSON.stringify(tx));localStorage.setItem("nome",nome)}catch(e){}};
const ym=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const sum=(a,tp)=>a.filter(t=>t.tp===tp).reduce((s,t)=>s+t.v,0);
const monthTx=()=>tx.filter(t=>t.dt.startsWith(ym(cur))).sort((a,b)=>b.dt.localeCompare(a.dt)||b.id-a.id);
const mesBar=()=>`<div class="mes"><button data-m="-1" aria-label="Mês anterior">‹</button><b>${cur.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}</b><button data-m="1" aria-label="Próximo mês">›</button></div>`;
const row=(t,del)=>`<div class="tx"><div class="d">${esc(t.d)}<span>${t.c} · ${t.dt.split("-").reverse().slice(0,2).join("/")}</span></div><div class="v ${t.tp==="R"?"in":"out"}">${t.tp==="R"?"+":"−"} ${brl(t.v)}</div>${del?`<button data-id="${t.id}" aria-label="Apagar">×</button>`:""}</div>`;
function catsHTML(m){
  const des=sum(m,"D"),by={};m.filter(t=>t.tp==="D").forEach(t=>by[t.c]=(by[t.c]||0)+t.v);
  const e=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  return e.length?e.map(([c,v])=>`<div class="cat"><div class="l"><span>${c}</span><span>${brl(v)}</span></div><div class="bar"><i style="width:${v/des*100}%"></i></div></div>`).join(""):'<div class="empty">Nenhuma despesa neste mês.</div>';
}
function render(){
  document.querySelectorAll("nav button").forEach(b=>b.className=b.dataset.t===tab?"on":"");
  const m=monthTx();let h="";
  if(tab==="home"){
    const hr=new Date().getHours(),sd=hr<12?"Bom dia":hr<18?"Boa tarde":"Boa noite";
    const total=sum(tx,"R")-sum(tx,"D"),recent=[...tx].sort((a,b)=>b.dt.localeCompare(a.dt)||b.id-a.id).slice(0,5);
    h+=`<div class="hi">${sd}${nome?", "+esc(nome):""}!</div><p class="sub">Veja como estão suas finanças.</p>`;
    if(!nome)h+=`<div class="card" style="margin-bottom:14px"><div class="nome"><input id="nm" placeholder="Como posso te chamar?"><button id="nmb">Salvar</button></div></div>`;
    h+=`<section class="hero"><small>Saldo total</small><div class="big">${brl(total)}</div><div class="row"><div><small>Receitas do mês</small><b>${brl(sum(m,"R"))}</b></div><div><small>Despesas do mês</small><b>${brl(sum(m,"D"))}</b></div></div></section>
    <div class="acts"><button class="o" data-n="D">− Despesa</button><button class="i" data-n="R">+ Receita</button></div>
    <h2>Últimos lançamentos <a data-go="ext">Ver tudo</a></h2>
    <div class="card">${recent.length?recent.map(t=>row(t,false)).join(""):'<div class="empty">Nada por aqui ainda. Toque em “Despesa” ou “Receita” para começar.</div>'}</div>`;
  }else if(tab==="ext"){
    h+=mesBar();
    if(!m.length)h+='<div class="card"><div class="empty">Sem lançamentos neste mês.</div></div>';
    else{let last="";m.forEach(t=>{if(t.dt!==last){if(last)h+="</div>";last=t.dt;h+=`<div class="day">${new Date(t.dt+"T12:00").toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"short"})}</div><div class="card">`}h+=row(t,true)});h+="</div>"}
  }else{
    h+=mesBar()+`<section class="hero"><small>Saldo do mês</small><div class="big">${brl(sum(m,"R")-sum(m,"D"))}</div><div class="row"><div><small>Receitas</small><b>${brl(sum(m,"R"))}</b></div><div><small>Despesas</small><b>${brl(sum(m,"D"))}</b></div></div></section><h2>Para onde foi seu dinheiro</h2><div class="card">${catsHTML(m)}</div>`;
  }
  $("app").innerHTML=h;
}
function setTipo(t){tipo=t;$("tD").className=t==="D"?"on":"";$("tR").className=t==="R"?"on":"";$("cat").innerHTML=(t==="D"?CD:CR).map(c=>`<option>${c}</option>`).join("")}
function openDlg(t){setTipo(t||"D");$("val").value="";$("desc").value="";$("dt").value=new Date().toISOString().slice(0,10);$("dlg").showModal()}
$("tD").onclick=()=>setTipo("D");$("tR").onclick=()=>setTipo("R");
$("add").onclick=()=>openDlg("D");$("cancel").onclick=()=>$("dlg").close();
$("save").onclick=()=>{
  const v=parseFloat($("val").value);if(!(v>0)){$("val").focus();return}
  const dt=$("dt").value||new Date().toISOString().slice(0,10);
  tx.push({id:Date.now(),tp:tipo,v,d:$("desc").value.trim()||$("cat").value,c:$("cat").value,dt});
  persist();$("dlg").close();cur=new Date(dt+"T12:00");cur.setDate(1);render();
};
document.querySelector("nav").onclick=e=>{const b=e.target.closest("button");if(b){tab=b.dataset.t;render();scrollTo(0,0)}};
$("app").onclick=e=>{
  const t=e.target;
  if(t.dataset.n)openDlg(t.dataset.n);
  else if(t.dataset.go){tab=t.dataset.go;render()}
  else if(t.dataset.m){cur.setMonth(cur.getMonth()+ +t.dataset.m);render()}
  else if(t.dataset.id){if(confirm("Apagar este lançamento?")){tx=tx.filter(x=>x.id!=t.dataset.id);persist();render()}}
  else if(t.id==="nmb"){const v=$("nm").value.trim();if(v){nome=v;persist();render()}}
};
render();
</script>
</body>
</html>
