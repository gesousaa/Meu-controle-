<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Controle</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3F1;--card:#fff;--ink:#12302B;--mute:#6B817C;--line:#DCE5E2;--brand:#0F4C45;--on:#fff;--in:#1E8E5A;--out:#D8434B;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1A18;--card:#152622;--ink:#E6F0ED;--mute:#8FA8A2;--line:#243A35;--brand:#3FBFA8;--on:#06201C;--in:#4CC98A;--out:#FF7A80}}
:root[data-theme="dark"]{--bg:#0D1A18;--card:#152622;--ink:#E6F0ED;--mute:#8FA8A2;--line:#243A35;--brand:#3FBFA8;--on:#06201C;--in:#4CC98A;--out:#FF7A80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 "Plus Jakarta Sans",system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 96px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.top button{background:none;border:0;color:var(--ink);font-size:24px;padding:8px 14px;cursor:pointer;border-radius:10px}
.top h1{font-size:18px;margin:0;font-weight:600;text-transform:capitalize}
.hero{background:var(--brand);color:var(--on);border-radius:20px;padding:22px 20px}
.hero small{opacity:.8}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-1px;margin:2px 0 14px}
.row{display:flex;gap:12px}.row>div{flex:1}
.row b{display:block;font-size:17px}
h2{font-size:15px;margin:26px 0 10px}
.card{background:var(--card);border-radius:16px;padding:6px 16px}
.cat{padding:10px 0}.cat+.cat{border-top:1px solid var(--line)}
.cat .l{display:flex;justify-content:space-between;font-size:14px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--out);border-radius:3px}
.day{font-size:13px;color:var(--mute);margin:16px 4px 6px}
.tx{display:flex;align-items:center;gap:12px;padding:12px 0}.tx+.tx{border-top:1px solid var(--line)}
.tx .d{flex:1;min-width:0}.tx .d span{display:block;font-size:12px;color:var(--mute)}
.tx .v{font-weight:600}.in{color:var(--in)}.out{color:var(--out)}
.tx button{background:none;border:0;color:var(--mute);font-size:18px;cursor:pointer;padding:6px}
.empty{padding:22px 0;text-align:center;color:var(--mute);font-size:14px}
.fab{position:fixed;right:max(20px,calc(50% - 240px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--brand);color:var(--on);border:0;border-radius:28px;padding:16px 24px;font:600 16px inherit;font-family:inherit;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer}
dialog{border:0;border-radius:20px;padding:20px;width:min(92vw,420px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{margin:0 0 14px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font:600 15px inherit;font-family:inherit;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:16px inherit;font-family:inherit}
.save{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:var(--brand);color:var(--on);font:600 16px inherit;font-family:inherit;cursor:pointer}
.cancel{width:100%;margin-top:6px;padding:12px;border:0;background:none;color:var(--mute);font:15px inherit;font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
</style>
</head>
<body>
<main>
  <div class="top"><button id="prev" aria-label="Mês anterior">‹</button><h1 id="mes"></h1><button id="next" aria-label="Próximo mês">›</button></div>
  <section class="hero">
    <small>Saldo do mês</small>
    <div class="big" id="saldo">R$ 0,00</div>
    <div class="row"><div><small>Receitas</small><b id="rec">R$ 0,00</b></div><div><small>Despesas</small><b id="des">R$ 0,00</b></div></div>
  </section>
  <h2>Para onde foi seu dinheiro</h2>
  <div class="card" id="cats"></div>
  <h2>Lançamentos</h2>
  <div id="lista"></div>
</main>
<button class="fab" id="add">+ Lançar</button>

<dialog id="dlg">
  <h3>Novo lançamento</h3>
  <div class="seg"><button id="tD" class="on">Despesa</button><button id="tR">Receita</button></div>
  <label for="val">Valor (R$)</label><input id="val" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0,00">
  <label for="desc">Descrição</label><input id="desc" type="text" placeholder="Ex.: mercado">
  <label for="cat">Categoria</label><select id="cat"></select>
  <label for="dt">Data</label><input id="dt" type="date">
  <button class="save" id="save">Salvar lançamento</button>
  <button class="cancel" id="cancel">Cancelar</button>
</dialog>

<script>
const CD=["Alimentação","Moradia","Transporte","Lazer","Saúde","Educação","Outros"],CR=["Salário","Freelance","Investimentos","Outros"];
const $=id=>document.getElementById(id),brl=n=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
let tx=[],tipo="D",cur=new Date();cur.setDate(1);
try{tx=JSON.parse(localStorage.getItem("tx")||"[]")}catch(e){tx=[]}
const persist=()=>{try{localStorage.setItem("tx",JSON.stringify(tx))}catch(e){}};
const ym=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
function render(){
  $("mes").textContent=cur.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  const m=tx.filter(t=>t.dt.startsWith(ym(cur))).sort((a,b)=>b.dt.localeCompare(a.dt)||b.id-a.id);
  const rec=m.filter(t=>t.tp==="R").reduce((s,t)=>s+t.v,0),des=m.filter(t=>t.tp==="D").reduce((s,t)=>s+t.v,0);
  $("saldo").textContent=brl(rec-des);$("rec").textContent=brl(rec);$("des").textContent=brl(des);
  const by={};m.filter(t=>t.tp==="D").forEach(t=>by[t.c]=(by[t.c]||0)+t.v);
  const ent=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  $("cats").innerHTML=ent.length?ent.map(([c,v])=>`<div class="cat"><div class="l"><span>${c}</span><span>${brl(v)}</span></div><div class="bar"><i style="width:${v/des*100}%"></i></div></div>`).join(""):'<div class="empty">Nenhuma despesa neste mês.</div>';
  if(!m.length){$("lista").innerHTML='<div class="card"><div class="empty">Sem lançamentos. Toque em “Lançar” para registrar o primeiro.</div></div>';return}
  let h="",last="";
  m.forEach(t=>{
    if(t.dt!==last){if(last)h+="</div>";last=t.dt;h+=`<div class="day">${new Date(t.dt+"T12:00").toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"short"})}</div><div class="card">`}
    h+=`<div class="tx"><div class="d">${t.d.replace(/</g,"&lt;")}<span>${t.c}</span></div><div class="v ${t.tp==="R"?"in":"out"}">${t.tp==="R"?"+":"−"} ${brl(t.v)}</div><button data-id="${t.id}" aria-label="Apagar">×</button></div>`;
  });
  $("lista").innerHTML=h+"</div>";
}
function setTipo(t){tipo=t;$("tD").className=t==="D"?"on":"";$("tR").className=t==="R"?"on":"";$("cat").innerHTML=(t==="D"?CD:CR).map(c=>`<option>${c}</option>`).join("")}
$("tD").onclick=()=>setTipo("D");$("tR").onclick=()=>setTipo("R");
$("add").onclick=()=>{setTipo("D");$("val").value="";$("desc").value="";$("dt").value=new Date().toISOString().slice(0,10);$("dlg").showModal()};
$("cancel").onclick=()=>$("dlg").close();
$("save").onclick=()=>{
  const v=parseFloat($("val").value);
  if(!(v>0)){$("val").focus();return}
  const dt=$("dt").value||new Date().toISOString().slice(0,10);
  tx.push({id:Date.now(),tp:tipo,v,d:$("desc").value.trim()||$("cat").value,c:$("cat").value,dt});
  persist();$("dlg").close();cur=new Date(dt+"T12:00");cur.setDate(1);render();
};
$("lista").onclick=e=>{const id=e.target.dataset.id;if(id&&confirm("Apagar este lançamento?")){tx=tx.filter(t=>t.id!=id);persist();render()}};
$("prev").onclick=()=>{cur.setMonth(cur.getMonth()-1);render()};
$("next").onclick=()=>{cur.setMonth(cur.getMonth()+1);render()};
render();
</script>
</body>
</html>
